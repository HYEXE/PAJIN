services:
  bug-bounty-target:
    image: pajin-bug-bounty-target:dev
    build:
      context: ./bug-bounty-target
    container_name: pajin-bug-bounty-target-lab
    environment:
      PAJIN_BUG_BOUNTY_LAB_PROFILE: ${PAJIN_BUG_BOUNTY_LAB_PROFILE:-vulnerable}
    ports:
      - "127.0.0.1:8770:8080"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    restart: "no"
