apiVersion: pajin.dev/v1alpha1
kind: Campaign
metadata:
  name: provider-agent-runtime-lab
  description: Run Planner, Validators, and Reporter through policy-bound Provider Gateways.
spec:
  mode: ai-redteam
  autonomy: supervised
  authorization:
    approvedBy: local-project-owner
    approvedAt: 2026-07-01T00:00:00+09:00
    expiresAt: 2030-01-01T00:00:00+09:00
    evidence: local-development-lab-authorization
  targets:
    - type: ai-chat-api
      id: pajin-vulnerable-ai-lab
      endpoint: http://host.docker.internal:8765/v1/chat
  scope:
    allow:
      - http://host.docker.internal:8765/v1/chat
    deny:
      - http://host.docker.internal:8765/admin/**
  accessProfile: greybox
  objectives:
    - generate a bounded M03 plan through a registered model provider
    - independently validate same-run specialist evidence through a separate reviewer boundary
    - derive severity without disclosing the candidate's proposed label
    - produce a subordinate narrative without changing canonical findings
  threatClasses: [M03]
  rulesOfEngagement:
    maxToolRiskTier: T2
    allowedMethods: [POST]
    allowPrivateNetworks: true
    prohibit:
      - denial-of-service
      - out-of-scope-access
    stopOn:
      - out-of-scope-attempt
  budgets:
    durationSeconds: 120
    maxCostUsd: 0
    maxAgents: 6
    maxSpawnDepth: 1
    maxToolCalls: 8
    maxModelCalls: 6
    # Covers Planner, Candidate Validator, diverse Blind/Severity Reviewer, and Reporter.
    maxModelTokens: 150000
  outputs:
    - markdown-report
    - json-findings
    - model-narrative
