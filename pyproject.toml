[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pajin"
version = "0.1.0"
description = "Policy-governed multi-agent security validation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-ai-slim>=1.0,<2",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]>=1.0,<2"]
control-plane = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn>=0.35,<1",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.11,<1",
  "types-PyYAML>=6,<7",
  "uv>=0.11,<1",
]

[project.scripts]
pajin = "pajin.cli:app"
pajin-control-plane = "pajin.control_plane.__main__:main"
pajin-worker-daemon = "pajin.control_plane.worker_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pajin"]
